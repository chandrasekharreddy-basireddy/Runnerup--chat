name: chatplatform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./.runtime/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
    networks: [internal]        # never published to the host

  redis:
    image: redis:7-alpine
    command: >
      redis-server --requirepass ${REDIS_PASSWORD}
      --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      retries: 10
    networks: [internal]        # never published to the host

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - miniodata:/data
    networks: [internal]

  api:
    build: ./backend
    env_file: [.env]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    networks: [internal]
    # Scale with `docker compose up --scale api=3`: the service is stateless and all
    # fan-out goes through Redis pub/sub, so any replica can serve any client.

  worker:
    build: ./backend
    env_file: [.env]
    depends_on:
      redis: {condition: service_healthy}
    command: python -m app.worker
    networks: [internal]

  web:
    build: ./frontend
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost/api/v1
      NEXT_PUBLIC_API_ORIGIN: http://localhost
      NEXT_PUBLIC_WS_URL: ws://localhost/ws
      NEXT_PUBLIC_WS_ORIGIN: ws://localhost
    depends_on: [api]
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    ports: ["443:443", "80:80"]
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    depends_on: [api, web]
    networks: [internal]

volumes: {pgdata: {}, redisdata: {}, miniodata: {}}
networks: {internal: {driver: bridge}}
