# Local-dev / self-hosted edge. In the managed deployment (Vercel + Render) the
# equivalent headers are set in frontend/next.config.mjs and backend/app/main.py,
# and TLS is terminated by the platform.
worker_processes auto;
events { worker_connections 4096; }

http {
  server_tokens off;
  client_max_body_size 1m;      # uploads go direct to object storage, not through here
  proxy_http_version 1.1;

  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_conn_zone $binary_remote_addr zone=conn:10m;

  server { listen 80; return 301 https://$host$request_uri; }

  server {
    listen 443 ssl;
    http2 on;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self' wss://$host; font-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    location /api/ {
      limit_req zone=api burst=40 nodelay;
      limit_conn conn 40;
      proxy_pass http://api:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
    }

    location /ws {
      proxy_pass http://api:8000;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 75s;
    }

    location / { proxy_pass http://web:3000; proxy_set_header Host $host; }
  }
}
